name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "v*.*"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.1"

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.hex/packages
          key: ${{ runner.os }}-mix-otp-28.1-elixir-1.19.1-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Create raw test veth pairs
        if: runner.os == 'Linux'
        run: |
          sudo ip link add veth-m0 type veth peer name veth-s0
          sudo ip link add veth-m1 type veth peer name veth-s1
          sudo ip link set veth-m0 up
          sudo ip link set veth-s0 up
          sudo ip link set veth-m1 up
          sudo ip link set veth-s1 up

      - name: Grant CAP_NET_RAW to BEAM
        if: runner.os == 'Linux'
        run: |
          BEAM=$(readlink -f "$(dirname "$(dirname "$(command -v erl)")")"/erts-*/bin/beam.smp)
          sudo setcap cap_net_raw+ep "$BEAM"
          getcap "$BEAM"

      - name: Configure simulator loopback on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2

      - name: Create isolated BPF test interfaces
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig feth0 create
          sudo ifconfig feth1 create
          sudo ifconfig feth1 peer feth0
          sudo ifconfig feth0 up
          sudo ifconfig feth1 up
          # Only this ephemeral runner gets direct BPF access. No physical NIC,
          # IP address, bridge, or Internet sharing is used by these tests.
          sudo chown "$(id -u):$(id -g)" /dev/bpf*
          echo "ETHERCAT_BPF_INTERFACE=feth0" >> "$GITHUB_ENV"
          echo "ETHERCAT_BPF_PEER_INTERFACE=feth1" >> "$GITHUB_ENV"

      - name: Run CI
        run: mix ci

      - name: Remove BPF test interfaces
        if: always() && runner.os == 'macOS'
        run: |
          sudo ifconfig feth0 destroy
          sudo ifconfig feth1 destroy
